[package]
name = "learning-goals"
version = "0.1.0"
description = "Learning roadmaps researched by the AI you already pay for, kept on your own Mac"
authors = ["Johnny Nguyen"]
edition = "2021"

[lib]
name = "learning_goals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
