[package]
name = "my-roadmaps"
version = "0.1.0"
description = "Learning roadmaps, researched by the Claude you are already signed into"
authors = ["Johnny Nguyen"]
edition = "2021"

[lib]
name = "my_roadmaps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
