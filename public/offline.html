<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · My Roadmaps</title>
    <meta name="theme-color" content="#0D9488" />
    <style>
      :root { color-scheme: light dark; --canvas:#f8fafc; --ink:#0f172a; --soft:#475569; --spine:#0d9488; --grp:#fff; --border:#cbd5e1; }
      @media (prefers-color-scheme: dark) {
        :root { --canvas:#0b1220; --ink:#e2e8f0; --soft:#94a3b8; --spine:#2dd4bf; --grp:#111a2e; --border:#1e293b; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh;
        display: grid; place-items: center;
        padding: 24px max(16px, env(safe-area-inset-left));
        background: var(--canvas); color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.55;
      }
      .card {
        max-width: 420px; width: 100%; text-align: center;
        background: var(--grp); border: 1px solid var(--border);
        border-radius: 16px; padding: 28px 22px;
      }
      svg { width: 84px; height: 84px; margin-bottom: 14px; }
      h1 { font-size: 21px; margin: 0 0 8px; }
      p { color: var(--soft); font-size: 15px; margin: 0 0 18px; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 10px 20px;
        background: var(--spine); color: #fff; text-decoration: none;
        border-radius: 10px; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) { a { color: #042f2e; } }
    </style>
  </head>
  <body>
    <main class="card">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="21" fill="#0D9488" />
        <path d="M12 50h76" stroke="#042F2E" stroke-width="5" stroke-linecap="round" />
        <g fill="#2DD4BF" stroke="#042F2E" stroke-width="2.2">
          <circle cx="24.5" cy="50" r="8.6" /><circle cx="50" cy="50" r="8.6" /><circle cx="75.5" cy="50" r="8.6" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        Your roadmaps live in your account, so they need a connection to load. Nothing is lost; try again when you're back online.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
