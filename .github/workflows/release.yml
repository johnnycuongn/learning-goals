# Builds the Mac installer and attaches it to a GitHub Release.
#
# Trigger: push a version tag (npm run release does the bump, commit and tag),
# or run it by hand from the Actions tab. The release is created as a draft so
# you can read it over before anyone can download it; publish it when happy.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build the DMG (Apple silicon + Intel)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::Tag is v$want but tauri.conf.json says $have. Use npm run release to bump both."
            exit 1
          fi

      # One universal DMG, so nobody has to know which chip their Mac has.
      # Unsigned (ad-hoc signed): no Apple Developer account is needed to build
      # it, and SETUP.md tells people how to open it the first time.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Learning Goals v__VERSION__
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles dmg
          releaseBody: |
            ## Install

            1. Download **Learning Goals_…_universal.dmg** below (works on Apple silicon and Intel Macs, macOS 11 or later).
            2. Open it and drag **Learning Goals** into **Applications**.
            3. The first time only: this build isn't notarised by Apple, so macOS will stop it. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to Learning Goals. (Or run `xattr -dr com.apple.quarantine "/Applications/Learning Goals.app"` in Terminal.)
            4. For AI research, install and sign in to **Claude Code** (`claude`) or **Codex** (`codex login`). Full guide: [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md).

            Your roadmaps stay on your Mac. Updating is the same drag into Applications; your data is kept.
